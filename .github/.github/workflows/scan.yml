name: scan
on:
  schedule:
    - cron: "0 7 * * *"   # denně 7:00 UTC (8:00/9:00 v Praze)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch.py
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - run: |
          git config user.name "scan-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json picks.jsonl
          git commit -m "scan" || exit 0
          git push
